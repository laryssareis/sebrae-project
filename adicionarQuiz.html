<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/stylesheet.css" type="text/css">
    <link rel="icon" href="img/logo-morrow.png" type="image/png">

    <title>Adicionar Quiz</title>
</head>
<body class="bg-all">
    
    <!--Utilizar method="POST" para enviar dados sensíveis, e method="GET" para dados que podem ser acessados diretamente pela URL-->
    
    <nav class="navbar navbar-dark fixed-top">
        <div class="container-fluid">
            
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">Morrow</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/interação.html">Help (Tire Dúvidas)</a>
                </li>
                </ul>
            
            </div>
        </div>
    </nav>
    
    <div class="container-login-cadastro">
        <form action="#" method="post">
           
            <div class="quiz-container">

                <h2 id="linha-roxa">Criar Pergunta</h2>

                <div class="mb-3">
                    <label>Pergunta</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Alternativa A</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Alternativa B</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Alternativa C</label>
                    <input type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Resposta Correta</label>
                    <select class="form-select selecionar">
                        <option selected disabled>Selecione</option>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                    </select>
                </div>

                <button class="btn btn-primary">
                    Adicionar Pergunta
                </button>

        </form>

    </div>

</body>
</html>
